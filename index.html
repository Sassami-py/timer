<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viagem 2026 - Contagem & Cofrinho</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12 flex flex-col items-center">

    <div class="w-full max-w-2xl px-4 pt-8 flex flex-col gap-6">

        <!-- HEADER / CONTAGEM REGRESSIVA -->
        <header class="bg-slate-800/80 backdrop-blur border border-slate-700/60 rounded-3xl p-6 shadow-xl text-center relative overflow-hidden">
            <div class="absolute -top-10 -left-10 w-32 h-32 bg-sky-500/10 rounded-full blur-2xl"></div>
            <div class="absolute -bottom-10 -right-10 w-32 h-32 bg-emerald-500/10 rounded-full blur-2xl"></div>

            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-sky-500/10 border border-sky-500/20 text-sky-400 text-xs font-semibold mb-3">
                <i data-lucide="plane-takeoff" class="w-4 h-4"></i>
                02 de Dezembro de 2026 às 06:40 (BRT)
            </div>

            <h1 class="text-xl sm:text-2xl font-bold text-slate-200 mb-5">Quanto tempo até a viagem?</h1>

            <!-- Grid do Cronômetro -->
            <div class="grid grid-cols-4 gap-2 sm:gap-4">
                <div class="bg-slate-900/80 border border-slate-700/50 rounded-2xl p-3 flex flex-col items-center">
                    <span id="days" class="text-2xl sm:text-4xl font-extrabold text-sky-400">00</span>
                    <span class="text-[10px] sm:text-xs text-slate-400 uppercase tracking-wider mt-1">Dias</span>
                </div>
                <div class="bg-slate-900/80 border border-slate-700/50 rounded-2xl p-3 flex flex-col items-center">
                    <span id="hours" class="text-2xl sm:text-4xl font-extrabold text-sky-400">00</span>
                    <span class="text-[10px] sm:text-xs text-slate-400 uppercase tracking-wider mt-1">Horas</span>
                </div>
                <div class="bg-slate-900/80 border border-slate-700/50 rounded-2xl p-3 flex flex-col items-center">
                    <span id="minutes" class="text-2xl sm:text-4xl font-extrabold text-sky-400">00</span>
                    <span class="text-[10px] sm:text-xs text-slate-400 uppercase tracking-wider mt-1">Min.</span>
                </div>
                <div class="bg-slate-900/80 border border-slate-700/50 rounded-2xl p-3 flex flex-col items-center">
                    <span id="seconds" class="text-2xl sm:text-4xl font-extrabold text-sky-400">00</span>
                    <span class="text-[10px] sm:text-xs text-slate-400 uppercase tracking-wider mt-1">Seg.</span>
                </div>
            </div>
        </header>

        <!-- CARDS FINANCEIROS -->
        <main class="flex flex-col gap-6">
            <!-- CARD SALDO ATUAL -->
            <div class="bg-gradient-to-br from-emerald-900/40 via-slate-800 to-slate-800 border border-emerald-500/30 rounded-3xl p-6 shadow-xl relative overflow-hidden">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-sm font-medium text-emerald-400 flex items-center gap-2">
                        <i data-lucide="wallet" class="w-4 h-4"></i>
                        Valor pra gastar na viagem!
                    </span>
                    <i data-lucide="piggy-bank" class="w-6 h-6 text-emerald-400/60"></i>
                </div>
                <div class="text-4xl sm:text-5xl font-black text-white tracking-tight mt-1" id="totalBalance">
                    R$ 0,00
                </div>
                <p class="text-xs text-slate-400 mt-2">Saldo acumulado guardado com carinho ✨</p>
            </div>

            <!-- FORMULÁRIO DE ADICIONAR / RETIRAR -->
            <div class="bg-slate-800/80 backdrop-blur border border-slate-700/60 rounded-3xl p-6 shadow-xl">
                <h2 class="text-lg font-semibold text-slate-200 mb-4 flex items-center gap-2">
                    <i data-lucide="arrow-right-left" class="w-5 h-5 text-sky-400"></i>
                    Nova Alteração
                </h2>

                <form id="transactionForm" class="flex flex-col gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Quem está alterando?</label>
                        <input type="text" id="personName" placeholder="Ex: Maria, João..." required
                            class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-sky-500 transition-colors">
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Valor (R$)</label>
                        <input type="number" id="amount" step="0.01" min="0.01" placeholder="0,00" required
                            class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-sky-500 transition-colors">
                    </div>

                    <div class="grid grid-cols-2 gap-3 pt-2">
                        <button type="button" onclick="handleTransaction('ADD')" 
                            class="flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-500 active:scale-[0.98] text-white font-semibold py-3 px-4 rounded-xl transition-all shadow-lg shadow-emerald-900/30">
                            <i data-lucide="plus-circle" class="w-4 h-4"></i>
                            Adicionar
                        </button>
                        <button type="button" onclick="handleTransaction('REMOVE')" 
                            class="flex items-center justify-center gap-2 bg-rose-600 hover:bg-rose-500 active:scale-[0.98] text-white font-semibold py-3 px-4 rounded-xl transition-all shadow-lg shadow-rose-900/30">
                            <i data-lucide="minus-circle" class="w-4 h-4"></i>
                            Retirar
                        </button>
                    </div>
                </form>
            </div>

            <!-- EXTRATO DAS ÚLTIMAS 5 ALTERAÇÕES -->
            <div class="bg-slate-800/80 backdrop-blur border border-slate-700/60 rounded-3xl p-6 shadow-xl">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-semibold text-slate-200 flex items-center gap-2">
                        <i data-lucide="history" class="w-5 h-5 text-sky-400"></i>
                        Últimas 5 Alterações
                    </h2>
                    <span class="text-xs text-slate-400">Mini Extrato</span>
                </div>

                <div id="historyList" class="flex flex-col gap-3">
                    <!-- Registros serão inseridos via JS -->
                </div>
            </div>
        </main>
    </div>

    <script>
        // --- CONTAGEM REGRESSIVA ---
        // Data alvo: 2 de Dezembro de 2026 às 06:40:00 (Horário de Brasília UTC-3)
        const targetDate = new Date('2026-12-02T06:40:00-03:00').getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference <= 0) {
                document.getElementById('days').innerText = "00";
                document.getElementById('hours').innerText = "00";
                document.getElementById('minutes').innerText = "00";
                document.getElementById('seconds').innerText = "00";
                return;
            }

            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById('days').innerText = String(days).padStart(2, '0');
            document.getElementById('hours').innerText = String(hours).padStart(2, '0');
            document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
            document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        // --- GERENCIAMENTO FINANCEIRO ---
        let transactions = JSON.parse(localStorage.getItem('trip_transactions')) || [];

        function formatCurrency(val) {
            return new Intl.NumberFormat('pt-BR', {
                style: 'currency',
                currency: 'BRL'
            }).format(val);
        }

        function calculateBalance() {
            return transactions.reduce((acc, curr) => {
                return curr.type === 'ADD' ? acc + curr.amount : acc - curr.amount;
            }, 0);
        }

        function updateUI() {
            // Atualizar Saldo Total
            const total = calculateBalance();
            document.getElementById('totalBalance').innerText = formatCurrency(total);

            // Atualizar Lista do Extrato (Apenas os últimos 5)
            const historyContainer = document.getElementById('historyList');
            historyContainer.innerHTML = '';

            const recentTransactions = transactions.slice(-5).reverse();

            if (recentTransactions.length === 0) {
                historyContainer.innerHTML = `
                    <div class="text-center py-6 text-slate-500 text-sm italic">
                        Nenhuma alteração realizada ainda.
                    </div>
                `;
                return;
            }

            recentTransactions.forEach(item => {
                const isAdd = item.type === 'ADD';
                const colorClass = isAdd ? 'text-emerald-400' : 'text-rose-400';
                const bgBadge = isAdd ? 'bg-emerald-500/10 border-emerald-500/20' : 'bg-rose-500/10 border-rose-500/20';
                const sign = isAdd ? '+' : '-';

                const card = document.createElement('div');
                card.className = 'bg-slate-900/60 border border-slate-700/40 rounded-2xl p-3.5 flex items-center justify-between';
                
                card.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl border ${bgBadge} flex items-center justify-center shrink-0">
                            <i data-lucide="${isAdd ? 'arrow-down-left' : 'arrow-up-right'}" class="w-5 h-5 ${colorClass}"></i>
                        </div>
                        <div>
                            <p class="text-sm font-semibold text-slate-200">${item.person}</p>
                            <p class="text-[11px] text-slate-400 flex items-center gap-1">
                                <i data-lucide="clock" class="w-3 h-3"></i>
                                ${item.datetime}
                            </p>
                        </div>
                    </div>
                    <div class="text-right">
                        <span class="text-base font-bold ${colorClass}">
                            ${sign} ${formatCurrency(item.amount)}
                        </span>
                    </div>
                `;
                historyContainer.appendChild(card);
            });

            // Re-inicializar ícones Lucide
            lucide.createIcons();
        }

        function handleTransaction(type) {
            const personInput = document.getElementById('personName');
            const amountInput = document.getElementById('amount');

            const person = personInput.value.trim();
            const amount = parseFloat(amountInput.value);

            if (!person) {
                alert('Por favor, informe quem realizou a alteração!');
                personInput.focus();
                return;
            }

            if (isNaN(amount) || amount <= 0) {
                alert('Por favor, informe um valor válido maior que zero!');
                amountInput.focus();
                return;
            }

            // Data/Hora exata de Brasília
            const now = new Date();
            const datetimeStr = now.toLocaleString('pt-BR', {
                timeZone: 'America/Sao_Paulo',
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            }).replace(',', ' às');

            const newTransaction = {
                id: Date.now(),
                person,
                amount,
                type,
                datetime: datetimeStr
            };

            transactions.push(newTransaction);
            localStorage.setItem('trip_transactions', JSON.stringify(transactions));

            // Limpar formulário mantendo o nome de quem digitou para agilizar próximas entradas
            amountInput.value = '';

            updateUI();
        }

        // Carregar ícones e dados ao iniciar
        window.onload = function() {
            lucide.createIcons();
            updateUI();
        };
    </script>
</body>
</html>
